name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages serve under /calendula/: prefix root links, make og:image absolute
      - name: Set base path
        run: |
          find site -name '*.html' -exec sed -i -E \
            -e 's#content="/og.png"#content="https://kutapps.github.io/calendula/og.png"#' \
            -e 's#(href|src)="/#\1="/calendula/#g' {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
